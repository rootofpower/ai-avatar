<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OLA - Real-time AI Avatar with Voice Assistant">
    <title>OLA – AI Avatar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 800px;
            padding: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            color: #8888aa;
        }

        #video-container {
            position: relative;
            width: 512px;
            height: 512px;
            margin: 0 auto 2rem;
            border-radius: 16px;
            overflow: hidden;
            background: #111118;
            border: 1px solid #222233;
        }

        #avatar-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #status-overlay {
            position: absolute;
            bottom: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            font-size: 0.75rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #444;
        }

        .status-dot.connected {
            background: #4ade80;
            box-shadow: 0 0 6px #4ade80;
        }

        .status-dot.connecting {
            background: #facc15;
            animation: pulse 1s infinite;
        }

        .status-dot.error {
            background: #f87171;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        button {
            padding: 0.75rem 2rem;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a2e;
            color: #ccc;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #252545;
            border-color: #555;
            color: #fff;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        button.primary {
            background: #2563eb;
            border-color: #3b82f6;
            color: #fff;
        }

        button.primary:hover {
            background: #1d4ed8;
        }

        #stats {
            font-size: 0.7rem;
            color: #555;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OLA Avatar</h1>

        <div id="video-container">
            <video id="avatar-video" autoplay playsinline muted></video>
            <div id="status-overlay">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">Disconnected</span>
            </div>
        </div>

        <div class="controls">
            <button id="btn-connect" class="primary" onclick="connect()">Connect</button>
            <button id="btn-disconnect" disabled onclick="disconnect()">Disconnect</button>
        </div>

        <div id="stats"></div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
